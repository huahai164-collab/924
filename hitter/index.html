<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>924 打手端</title><style>:root{--bg:#070707;--panel:#111;--line:#382a24;--gold:#d7b15d;--red:#7d1f1f;--text:#f5efe6;--muted:#aaa097}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#160909,#070707 32%);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.brand{font-size:26px;font-weight:900;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.card,.item{background:#111;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0b0b0b;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;color:var(--gold);font-size:22px}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button,button{background:#171717;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button.active,.primary{background:#7d1f1f}.input{width:100%;background:#090909;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#381515;color:#ffb7b7;font-size:12px}.gold{color:var(--gold);font-size:22px;font-weight:900}.coin{color:var(--gold);font-size:24px;font-weight:900}.hidden{display:none}.notice{padding:11px;border:1px solid #6c4c22;background:#25180d;color:#e6c879;border-radius:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}.tabs button{flex:1;white-space:nowrap}}</style></head><body><div class="wrap"><div class="row"><div><div class="brand">924 黑手党 Club · 打手端</div><div class="muted">抢单、当前订单、金币账户 · 1元 = 10金币</div></div><button id="logout" class="hidden">退出</button></div><div id="auth" class="card"><h2>打手登录</h2><input id="email" class="input" placeholder="后台分配的邮箱"><input id="pwd" class="input" type="password" placeholder="密码"><button id="login" class="primary">登录</button><div id="authmsg" class="muted">打手账号由后台创建，不能自行注册。</div></div><div id="main" class="hidden"><div class="tabs"><button class="active" data-p="grab">抢单主页</button><button data-p="current">当前订单</button><button data-p="wallet">账户/历史</button></div><div id="page"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://xsfofqinyqinrleqemfj.supabase.co','sb_publishable_UFjJIyYT_pnuB5aUU7Yppw_hP1I0f-k',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});let me=null,hitter=null;const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],rank={B:1,A:2,S:3,SS:4};const toCoins=v=>Math.round(Number(v||0)*10);function showLoggedOut(){q('#auth').classList.remove('hidden');q('#main').classList.add('hidden');q('#logout').classList.add('hidden')}function showLoggedIn(){q('#auth').classList.add('hidden');q('#main').classList.remove('hidden');q('#logout').classList.remove('hidden')}async function refresh(){const {data:{session},error:sessionError}=await sb.auth.getSession();if(sessionError){q('#authmsg').textContent='登录状态读取失败，请刷新页面重试。';return}if(!session){showLoggedOut();return}me=session.user;showLoggedIn();const {data,error}=await sb.from('club924_hitters').select('*').eq('user_id',me.id).maybeSingle();if(error){q('#page').innerHTML='<div class="card"><div class="notice">打手资料暂时读取失败，但登录状态已保留。请刷新页面重试。</div></div>';return}if(!data){q('#page').innerHTML='<div class="card"><div class="notice">当前登录账号尚未绑定打手资料。登录状态不会因此丢失。</div></div>';return}hitter=data;show('grab')}q('#login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:q('#email').value.trim(),password:q('#pwd').value});q('#authmsg').textContent=error?error.message:'';if(!error)refresh()};q('#logout').onclick=async()=>{await sb.auth.signOut();me=null;hitter=null;showLoggedOut()};qa('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));async function show(p){if(!hitter)return;qa('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));const box=q('#page');if(p==='grab'){const {data=[],error}=await sb.from('club924_orders').select('*').in('status',['预抢中','待抢']).order('created_at');if(error){box.innerHTML='<div class="card"><div class="notice">订单读取失败：'+error.message+'</div></div>';return}const a=data.filter(o=>rank[hitter.level]>=rank[o.min_hitter_level]);box.innerHTML='<div class="card"><h2>可抢订单 · '+hitter.name+' '+hitter.level+'</h2><div class="muted">订单金额按 1元 = 10金币 自动换算，打手端不显示人民币价格。</div>'+ (a.length?a.map(o=>`<div class="item"><div class="row"><b>${o.order_name}</b><span class="badge">${o.status}</span></div><div class="coin">🪙 ${toCoins(o.amount)} 金币</div><div>最低 ${o.min_hitter_level} · 需要 ${o.required_hitter_count} 人</div><button class="primary" onclick="grab('${o.id}')">抢单</button></div>`).join(''):'<div class="muted">暂无可抢订单</div>')+'</div>'}if(p==='current'){const {data=[]}=await sb.from('club924_order_hitters').select('share,commission_rate,assignment_status,club924_orders(id,order_name,amount,status,note)').eq('hitter_id',hitter.id).eq('assignment_status','进行中');box.innerHTML='<div class="card"><h2>当前订单</h2>'+ (data.length?data.map(x=>`<div class="item"><div class="row"><b>${x.club924_orders?.order_name||''}</b><span class="badge">${x.club924_orders?.status||''}</span></div><div class="coin">🪙 ${toCoins(x.club924_orders?.amount)} 金币</div><div>你的分配：${x.share}%</div></div>`).join(''):'<div class="muted">暂无当前订单</div>')+'</div>'}if(p==='wallet'){const {data:w}=await sb.from('club924_wallets').select('*').eq('hitter_id',hitter.id).maybeSingle();box.innerHTML=`<div class="card"><h2>账户</h2><div class="grid"><div class="stat">可用金币<b>${w?.available_coins||0}</b></div><div class="stat">冻结金币<b>${w?.frozen_coins||0}</b></div><div class="stat">人民币参考<b>¥${((w?.available_coins||0)/10).toFixed(2)}</b></div></div><input id="coins" class="input" type="number" placeholder="提现金币"><button class="primary" onclick="withdraw()">申请提现</button></div>`}}window.grab=async id=>{const {error}=await sb.from('club924_grab_requests').insert({order_id:id,hitter_id:hitter.id});alert(error?error.message:'已提交抢单')};window.withdraw=async()=>{const coins=Number(q('#coins').value);const {error}=await sb.from('club924_withdrawals').insert({hitter_id:hitter.id,coins});alert(error?error.message:'提现申请已提交')};sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){me=null;hitter=null;showLoggedOut();return}if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'||event==='INITIAL_SESSION')setTimeout(refresh,0)});refresh();</script></body></html>
