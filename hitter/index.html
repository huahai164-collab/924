<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>924 打手端</title><style>:root{--line:#382a24;--gold:#d7b15d;--text:#f5efe6;--muted:#aaa097}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#160909,#070707 32%);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.brand{font-size:26px;font-weight:900;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.card,.item{background:#111;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0b0b0b;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;color:var(--gold);font-size:22px}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button,button{background:#171717;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button.active,.primary{background:#7d1f1f}.input{width:100%;background:#090909;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#381515;color:#ffb7b7;font-size:12px}.coin{color:var(--gold);font-size:24px;font-weight:900}.hidden{display:none}.notice{padding:11px;border:1px solid #6c4c22;background:#25180d;color:#e6c879;border-radius:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}.tabs button{flex:1;white-space:nowrap}}</style></head><body><div class="wrap"><div class="row"><div><div class="brand">924 黑手党 Club · 打手端</div><div class="muted">抢单、当前订单、金币账户 · 1元 = 10金币</div></div><button id="logout" class="hidden" onclick="logoutNow()">退出</button></div><div id="auth" class="card"><h2>打手登录</h2><input id="username" class="input" placeholder="用户名" autocomplete="username"><input id="pwd" class="input" type="password" placeholder="密码" autocomplete="current-password"><button id="login" class="primary" type="button" onclick="loginNow()">登录</button><div id="authmsg" class="muted">正在加载登录组件…</div></div><div id="main" class="hidden"><div class="tabs"><button class="active" data-p="grab">抢单主页</button><button data-p="current">当前订单</button><button data-p="wallet">账户/历史</button></div><div id="page"></div></div></div><script src="/supabase-lite.js"></script><script>const URL='https://xsfofqinyqinrleqemfj.supabase.co',KEY='sb_publishable_UFjJIyYT_pnuB5aUU7Yppw_hP1I0f-k';let sb=null,hitter=null,me=null;const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],rank={B:1,A:2,S:3,SS:4};const toCoins=v=>Math.round(Number(v||0)*10);function logged(v){q('#auth').classList.toggle('hidden',v);q('#main').classList.toggle('hidden',!v);q('#logout').classList.toggle('hidden',!v)}async function init(){try{sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage,storageKey:'club924_hitter_session'}});qa('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));q('#authmsg').textContent='打手账号由后台创建，不开放自行注册。';await refresh()}catch(e){q('#authmsg').textContent=e.message}}async function loginNow(){const msg=q('#authmsg'),u=q('#username').value.trim(),p=q('#pwd').value;if(!sb){msg.textContent='登录组件正在加载，请稍后再点一次';return}if(!u||!p){msg.textContent='请输入用户名和密码';return}msg.textContent='登录中…';q('#login').disabled=true;try{const {data,error}=await sb.functions.invoke('club924-portal-login',{body:{portal:'hitter',username:u,password:p}});if(error)throw new Error(error.message||'登录接口失败');if(!data||data.error)throw new Error(data?.error||'登录失败');const r=await sb.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(r.error)throw r.error;msg.textContent='登录成功';await refresh()}catch(e){msg.textContent='登录失败：'+(e.message||e)}finally{q('#login').disabled=false}}async function refresh(){if(!sb)return;const {data:{session},error}=await sb.auth.getSession();if(error){q('#authmsg').textContent='登录状态读取失败：'+error.message;logged(false);return}if(!session){logged(false);return}me=session.user;const r=await sb.from('club924_hitters').select('*').eq('user_id',me.id).maybeSingle();if(r.error||!r.data){logged(false);q('#authmsg').textContent=r.error?'打手资料读取失败：'+r.error.message:'该账号不是打手账号';return}hitter=r.data;logged(true);show('grab')}async function logoutNow(){if(sb)await sb.auth.signOut();hitter=null;me=null;logged(false)}async function show(p){if(!hitter)return;qa('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));const box=q('#page');if(p==='grab'){const {data=[],error}=await sb.from('club924_orders').select('*').in('status',['预抢中','待抢']).order('created_at');if(error){box.innerHTML='<div class="card notice">订单读取失败：'+error.message+'</div>';return}const a=data.filter(o=>rank[hitter.level]>=rank[o.min_hitter_level]);box.innerHTML='<div class="card"><h2>可抢订单 · '+hitter.name+' '+hitter.level+'</h2><div class="muted">订单金额按 1元 = 10金币 自动换算，打手端不显示人民币价格。</div>'+(a.length?a.map(o=>'<div class="item"><div class="row"><b>'+o.order_name+'</b><span class="badge">'+o.status+'</span></div><div class="coin">🪙 '+toCoins(o.amount)+' 金币</div><div>最低 '+o.min_hitter_level+' · 需要 '+o.required_hitter_count+' 人</div><button class="primary" onclick="grab(\''+o.id+'\')">抢单</button></div>').join(''):'<div class="muted">暂无可抢订单</div>')+'</div>'}else if(p==='current'){const {data=[],error}=await sb.from('club924_order_hitters').select('share,commission_rate,assignment_status,club924_orders(id,order_name,amount,status,note)').eq('hitter_id',hitter.id).eq('assignment_status','进行中');if(error){box.innerHTML='<div class="card notice">当前订单读取失败：'+error.message+'</div>';return}box.innerHTML='<div class="card"><h2>当前订单</h2>'+(data.length?data.map(x=>'<div class="item"><div class="row"><b>'+(x.club924_orders?.order_name||'')+'</b><span class="badge">'+(x.club924_orders?.status||'')+'</span></div><div class="coin">🪙 '+toCoins(x.club924_orders?.amount)+' 金币</div><div>你的分配：'+x.share+'%</div></div>').join(''):'<div class="muted">暂无当前订单</div>')+'</div>'}else if(p==='wallet'){const {data:w}=await sb.from('club924_wallets').select('*').eq('hitter_id',hitter.id).maybeSingle();box.innerHTML='<div class="card"><h2>账户</h2><div class="grid"><div class="stat">可用金币<b>'+(w?.available_coins||0)+'</b></div><div class="stat">冻结金币<b>'+(w?.frozen_coins||0)+'</b></div><div class="stat">用户名<b>'+(hitter.login_name||hitter.name)+'</b></div></div><input id="coins" class="input" type="number" placeholder="提现金币"><button class="primary" onclick="withdraw()">申请提现</button></div>'}}async function grab(id){const {error}=await sb.from('club924_grab_requests').insert({order_id:id,hitter_id:hitter.id});alert(error?error.message:'已提交抢单')}async function withdraw(){const coins=Number(q('#coins').value);const {error}=await sb.from('club924_withdrawals').insert({hitter_id:hitter.id,coins});alert(error?error.message:'提现申请已提交')}window.loginNow=loginNow;window.logoutNow=logoutNow;window.grab=grab;window.withdraw=withdraw;window.addEventListener('load',init);</script></body></html>
