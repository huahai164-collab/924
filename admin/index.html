<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>924 管理后台</title><style>:root{--line:#382a24;--gold:#d7b15d;--text:#f5efe6;--muted:#aaa097}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#160909,#070707 32%);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.brand{font-size:26px;font-weight:900;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.card,.item{background:#111;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b0b0b;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;color:var(--gold);font-size:22px}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button,button{background:#171717;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button.active,.primary{background:#7d1f1f}.input,select,textarea{width:100%;background:#090909;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#381515;color:#ffb7b7;font-size:12px}.badge.on{background:#14351d;color:#a8efb5}.gold{color:var(--gold);font-size:22px;font-weight:900}.hidden{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ok{color:#84d98d}.err{color:#ff8b8b}.mini{padding:8px 11px;font-size:12px}.danger{background:#4b1717}.field label{display:block;font-weight:800;margin-top:5px}.hint{font-size:12px;color:var(--muted);margin:2px 0 4px}.section-note{padding:10px 12px;border-radius:10px;background:#17120d;border:1px solid #5a4022;color:#e4c57e;margin:10px 0}@media(max-width:700px){.grid,.two{grid-template-columns:1fr 1fr}.tabs button{white-space:nowrap}}@media(max-width:520px){.two,.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="row"><div><div class="brand">924 黑手党 Club · 管理后台</div><div class="muted">老板、打手、订单、商品、财务统一管理</div></div><button id="logout" class="hidden">退出</button></div><div id="auth" class="card"><h2>后台登录</h2><div class="field"><label>管理员邮箱</label><input id="email" class="input" placeholder="输入管理员邮箱"></div><div class="field"><label>管理员密码</label><input id="pwd" class="input" type="password" placeholder="输入密码"></div><button id="login" class="primary">登录</button><div id="authmsg" class="muted">后台仅允许已授权管理员账号。</div></div><div id="main" class="hidden"><div class="tabs"><button data-p="dash">概览</button><button data-p="accounts">账户管理</button><button data-p="orders">订单</button><button data-p="bosses">老板</button><button data-p="hitters">打手</button><button data-p="products">商品上架</button><button data-p="finance">提现</button></div><div id="page"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script>const SUPABASE_URL='https://xsfofqinyqinrleqemfj.supabase.co';const SUPABASE_KEY='sb_publishable_UFjJIyYT_pnuB5aUU7Yppw_hP1I0f-k';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let member=null;const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];async function refresh(){const {data:{session}}=await sb.auth.getSession();if(!session){q('#auth').classList.remove('hidden');q('#main').classList.add('hidden');q('#logout').classList.add('hidden');return}const {data,error}=await sb.from('club924_members').select('*').eq('user_id',session.user.id).maybeSingle();if(error||!data||!data.is_active){q('#authmsg').textContent=error?'后台权限读取失败：'+error.message:'该账号没有后台权限。';await sb.auth.signOut();return}member=data;q('#auth').classList.add('hidden');q('#main').classList.remove('hidden');q('#logout').classList.remove('hidden');show('dash')}q('#login').onclick=async()=>{q('#authmsg').textContent='登录中…';const {error}=await sb.auth.signInWithPassword({email:q('#email').value.trim(),password:q('#pwd').value});q('#authmsg').textContent=error?error.message:'';if(!error)refresh()};q('#logout').onclick=async()=>{await sb.auth.signOut();refresh()};qa('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));async function show(p){qa('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));const box=q('#page');if(p==='dash'){const [{count:o},{count:b},{count:h},{count:w}]=await Promise.all([sb.from('club924_orders').select('*',{count:'exact',head:true}),sb.from('club924_bosses').select('*',{count:'exact',head:true}),sb.from('club924_hitters').select('*',{count:'exact',head:true}),sb.from('club924_withdrawals').select('*',{count:'exact',head:true})]);box.innerHTML=`<div class="grid"><div class="stat">订单<b>${o||0}</b></div><div class="stat">老板<b>${b||0}</b></div><div class="stat">打手<b>${h||0}</b></div><div class="stat">提现<b>${w||0}</b></div></div>`}else if(p==='accounts'){box.innerHTML=`<div class="card"><h2>生成账户</h2><div class="two"><div class="field"><label>账户类型</label><select id="accType"><option value="boss">老板账户</option><option value="hitter">打手账户</option></select></div><div class="field"><label>昵称</label><input id="accName" class="input" placeholder="例如：老板A / 小弟阿强"></div><div class="field"><label>登录邮箱</label><input id="accEmail" class="input" type="email" placeholder="name@example.com"></div><div class="field"><label>初始密码</label><input id="accPwd" class="input" type="password" placeholder="至少8位"></div></div><div id="extra"></div><button id="createAcc" class="primary">生成账户</button><div id="accMsg" class="muted"></div></div>`;const renderExtra=()=>{q('#extra').innerHTML=q('#accType').value==='hitter'?`<div class="field"><label>打手等级</label><select id="accLevel"><option>B</option><option>A</option><option>S</option><option>SS</option></select></div>`:`<div class="field"><label>老板会员等级</label><select id="accMember"><option>普通</option><option>VIP</option><option>SVIP</option><option>至尊</option></select></div>`};renderExtra();q('#accType').onchange=renderExtra;q('#createAcc').onclick=async()=>{const msg=q('#accMsg');const payload={type:q('#accType').value,name:q('#accName').value.trim(),email:q('#accEmail').value.trim(),password:q('#accPwd').value};if(payload.type==='hitter')payload.level=q('#accLevel').value;else payload.member_level=q('#accMember').value;msg.textContent='正在创建…';const {data,error}=await sb.functions.invoke('club924-account-admin',{body:payload});msg.className=error||data?.error?'err':'ok';msg.textContent=error?'创建失败：'+error.message:data?.error?'创建失败：'+data.error:'创建成功'};}else if(p==='orders'){const {data=[]}=await sb.from('club924_orders').select('*').order('created_at',{ascending:false}).limit(50);box.innerHTML='<div class="card"><h2>订单管理</h2>'+data.map(o=>`<div class="item"><div class="row"><b>${o.order_name}</b><span class="badge">${o.status}</span></div><div>老板价 ¥${o.amount} · 打手显示 ${Math.round(Number(o.amount||0)*10)}金币 · 最低 ${o.min_hitter_level} · ${o.required_hitter_count}人</div></div>`).join('')+'</div>'}else if(p==='bosses'){const {data=[]}=await sb.from('club924_bosses').select('*');box.innerHTML='<div class="card"><h2>老板账户</h2>'+data.map(x=>`<div class="item"><b>${x.name}</b> · ${x.member_level} · 累计 ¥${x.cumulative_spend||0}</div>`).join('')+'</div>'}else if(p==='hitters'){const {data=[]}=await sb.from('club924_hitters').select('*');box.innerHTML='<div class="card"><h2>打手账户</h2>'+data.map(x=>`<div class="item"><b>${x.name}</b> · ${x.level} · 押金 ${x.deposit_paid}/${x.deposit_total} · ${x.status}</div>`).join('')+'</div>'}else if(p==='products'){const {data=[]}=await sb.from('club924_products').select('*').order('sort_order');box.innerHTML=`<div class="card"><h2>订单商品上架</h2><div class="section-note">老板端显示人民币价格；打手端自动按 ¥1 = 10金币 换算。下架只影响新点单，不删除历史订单。</div><div class="two"><div class="field"><label>① 订单名称</label><div class="hint">老板和打手看到的名字，例如：小弟不下班</div><input id="prodName" class="input" placeholder="例如：小弟不下班"></div><div class="field"><label>② 老板价格（人民币）</label><div class="hint">老板端看到的价格，例如填 388</div><input id="prodPrice" class="input" type="number" step="0.01" placeholder="例如：388"></div><div class="field"><label>③ 订单分类</label><div class="hint">例如：绝密航天、监狱、常规单</div><input id="prodCategory" class="input" placeholder="例如：绝密航天"></div><div class="field"><label>④ 最低接单等级</label><div class="hint">低于这个等级的打手看不到/不能抢</div><select id="prodLevel"><option value="B">B 新血</option><option value="A">A 混混</option><option value="S">S 猎杀</option><option value="SS">SS 执行者</option></select></div><div class="field"><label>⑤ 需要几名打手</label><div class="hint">一般填 2；一人单就填 1</div><input id="prodHitters" class="input" type="number" min="1" max="8" value="2"></div><div class="field"><label>⑥ 显示排序</label><div class="hint">数字越小越靠前；不知道就保持 0</div><input id="prodSort" class="input" type="number" value="0"></div></div><div class="field"><label>⑦ 订单说明</label><div class="hint">玩法、保底、注意事项等；可以留空</div><textarea id="prodDesc" class="input" rows="4" placeholder="例如：388R，保底……"></textarea></div><button id="createProdBtn" class="primary" onclick="createProduct()">新增并上架</button><div id="prodMsg" class="muted"></div></div><div class="card"><h2>已录入项目</h2>`+(data.length?data.map(x=>`<div class="item"><div class="row"><div><b>${x.name}</b> <span class="badge ${x.is_active?'on':''}">${x.is_active?'已上架':'已下架'}</span><div class="muted">${x.category||'常规单'} · 最低 ${x.default_min_hitter_level||'B'} · ${x.default_required_hitter_count||2}人</div></div><div><div class="gold">¥${x.price}</div><div class="muted">打手端 ${Math.round(Number(x.price||0)*10)}金币</div></div></div><div class="row"><button class="mini" onclick="editPrice('${x.id}',${Number(x.price||0)})">修改价格</button><button class="mini ${x.is_active?'danger':'primary'}" onclick="toggleProduct('${x.id}',${!x.is_active})">${x.is_active?'下架':'上架'}</button></div></div>`).join(''):'<div class="muted">暂无项目</div>')+'</div>'}else if(p==='finance'){const {data=[]}=await sb.from('club924_withdrawals').select('*').order('requested_at',{ascending:false});box.innerHTML='<div class="card"><h2>提现</h2>'+data.map(x=>`<div class="item">${x.coins}金币 = ¥${x.rmb_amount} <span class="badge">${x.status}</span></div>`).join('')+'</div>'}}
async function productAdmin(body){const {data:{session},error:sessionError}=await sb.auth.getSession();if(sessionError||!session?.access_token)throw new Error('登录状态已失效，请退出后台后重新登录');const res=await fetch(SUPABASE_URL+'/functions/v1/club924-product-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify(body)});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data?.error||('服务器错误 '+res.status));if(data?.error)throw new Error(data.error);return data}
window.createProduct=async()=>{const msg=q('#prodMsg'),btn=q('#createProdBtn');const payload={action:'create',name:q('#prodName').value.trim(),price:Number(q('#prodPrice').value),category:q('#prodCategory').value.trim()||'常规单',description:q('#prodDesc').value.trim()||null,default_min_hitter_level:q('#prodLevel').value,default_required_hitter_count:Number(q('#prodHitters').value||2),sort_order:Number(q('#prodSort').value||0)};if(!payload.name){msg.className='err';msg.textContent='请填写订单名称';return}if(!Number.isFinite(payload.price)||payload.price<0){msg.className='err';msg.textContent='请填写正确的老板价格';return}btn.disabled=true;msg.className='muted';msg.textContent='正在新增…';try{await productAdmin(payload);msg.className='ok';msg.textContent='新增并上架成功';await show('products')}catch(e){msg.className='err';msg.textContent='新增失败：'+e.message}finally{if(q('#createProdBtn'))q('#createProdBtn').disabled=false}};
window.toggleProduct=async(id,is_active)=>{try{await productAdmin({action:'toggle',id,is_active});alert(is_active?'已上架':'已下架');await show('products')}catch(e){alert('操作失败：'+e.message)}};
window.editPrice=async(id,current)=>{const v=prompt('输入新的老板端价格（元）',current);if(v===null)return;const price=Number(v);if(!Number.isFinite(price)||price<0)return alert('价格格式错误');try{await productAdmin({action:'price',id,price});alert(`价格已更新；打手端自动显示 ${Math.round(price*10)} 金币`);await show('products')}catch(e){alert('修改失败：'+e.message)}};
sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();</script></body></html>
