<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>924 管理后台</title><style>:root{--line:#382a24;--gold:#d7b15d;--text:#f5efe6;--muted:#aaa097}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#160909,#070707 32%);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.brand{font-size:26px;font-weight:900;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.card,.item{background:#111;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#0b0b0b;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;color:var(--gold);font-size:22px}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button,button{background:#171717;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button.active,.primary{background:#7d1f1f}.input,select,textarea{width:100%;background:#090909;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#381515;color:#ffb7b7;font-size:12px}.gold{color:var(--gold);font-size:22px;font-weight:900}.hidden{display:none}.ok{color:#84d98d}.err{color:#ff8b8b}.live{color:#84d98d;font-size:12px}@media(max-width:700px){.grid,.two{grid-template-columns:1fr}.tabs button{white-space:nowrap}}</style></head><body><div class="wrap"><div class="row"><div><div class="brand">924 黑手党 Club · 管理后台</div><div class="muted">老板、打手、订单、商品、财务统一管理</div></div><div><span id="live" class="live hidden">● 订单实时同步</span> <button id="logout" class="hidden" type="button">退出</button></div></div><div id="auth" class="card"><h2>后台登录</h2><input id="username" class="input" autocomplete="username" placeholder="管理员用户名"><input id="pwd" class="input" type="password" autocomplete="current-password" placeholder="管理员密码"><button id="login" class="primary" type="button" onclick="adminLogin()">登录</button><div id="authmsg" class="muted">正在加载登录组件…</div></div><div id="main" class="hidden"><div class="tabs"><button data-p="dash">概览</button><button data-p="accounts">账户管理</button><button data-p="orders">订单</button><button data-p="bosses">老板</button><button data-p="hitters">打手</button><button data-p="products">商品上架</button><button data-p="finance">提现</button></div><div id="page"></div></div></div><script src="/supabase-lite.js"></script><script>const URL='https://xsfofqinyqinrleqemfj.supabase.co',KEY='sb_publishable_UFjJIyYT_pnuB5aUU7Yppw_hP1I0f-k';let sb=null,member=null,currentPage='dash',orderChannel=null;const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];function logged(v){q('#auth').classList.toggle('hidden',v);q('#main').classList.toggle('hidden',!v);q('#logout').classList.toggle('hidden',!v);q('#live').classList.toggle('hidden',!v)}function msg(t,c='muted'){q('#authmsg').className=c;q('#authmsg').textContent=t}async function init(){try{sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'club924_admin_session'}});q('#logout').onclick=logout;qa('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));q('#pwd').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});msg('后台仅允许管理员账号登录。');await refresh()}catch(e){msg(e.message||'页面初始化失败','err')}}async function adminLogin(){if(!sb){msg('登录组件正在加载，请稍后再点一次','err');return}const username=q('#username').value.trim(),password=q('#pwd').value;if(!username||!password){msg('请输入管理员用户名和密码','err');return}const btn=q('#login');btn.disabled=true;btn.textContent='登录中…';msg('正在验证管理员账号…');try{const {data,error}=await sb.functions.invoke('club924-portal-login',{body:{portal:'admin',username,password}});if(error)throw new Error(error.message||'登录接口失败');if(!data||data.error)throw new Error(data?.error||'登录失败');const r=await sb.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(r.error)throw r.error;await refresh()}catch(e){msg('登录失败：'+(e.message||'未知错误'),'err')}finally{btn.disabled=false;btn.textContent='登录'}}window.adminLogin=adminLogin;async function refresh(){if(!sb)return;const {data:{session},error:sErr}=await sb.auth.getSession();if(sErr)throw sErr;if(!session){logged(false);return}const {data,error}=await sb.from('club924_members').select('*').eq('user_id',session.user.id).maybeSingle();if(error)throw error;if(!data||!data.is_active||data.role!=='admin'){msg('该账号没有管理员权限','err');logged(false);return}member=data;logged(true);startRealtime();await show(currentPage)}async function logout(){if(orderChannel){await sb.removeChannel(orderChannel);orderChannel=null}await sb.auth.signOut();member=null;logged(false);msg('已退出后台')}function startRealtime(){if(orderChannel)return;orderChannel=sb.channel('admin-orders-live').on('postgres_changes',{event:'*',schema:'public',table:'club924_orders'},()=>{if(currentPage==='orders'||currentPage==='dash')show(currentPage)}).subscribe()}async function show(p){currentPage=p;qa('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));const box=q('#page');if(p==='dash'){const [{count:o},{count:b},{count:h},{count:w}]=await Promise.all([sb.from('club924_orders').select('*',{count:'exact',head:true}),sb.from('club924_bosses').select('*',{count:'exact',head:true}),sb.from('club924_hitters').select('*',{count:'exact',head:true}),sb.from('club924_withdrawals').select('*',{count:'exact',head:true})]);box.innerHTML=`<div class="grid"><div class="stat">订单<b>${o||0}</b></div><div class="stat">老板<b>${b||0}</b></div><div class="stat">打手<b>${h||0}</b></div><div class="stat">提现<b>${w||0}</b></div></div>`;return}if(p==='accounts'){box.innerHTML=`<div class="card"><h2>生成老板 / 打手账户</h2><div class="muted">只设置用户名和密码，不需要邮箱。</div><div class="two"><div><label>账户类型</label><select id="accType"><option value="boss">老板账户</option><option value="hitter">打手账户</option></select></div><div><label>用户名</label><input id="accUser" class="input"></div><div><label>显示昵称</label><input id="accName" class="input"></div><div><label>初始密码</label><input id="accPwd" type="password" class="input"></div></div><div id="extra"></div><button id="createAcc" class="primary" type="button">生成账户</button><div id="accMsg" class="muted"></div></div>`;const extra=()=>q('#extra').innerHTML=q('#accType').value==='hitter'?'<label>打手等级</label><select id="accLevel"><option>B</option><option>A</option><option>S</option><option>SS</option></select>':'<label>老板会员等级</label><select id="accMember"><option>普通</option><option>VIP</option><option>SVIP</option><option>至尊</option></select>';extra();q('#accType').onchange=extra;q('#createAcc').onclick=async()=>{const m=q('#accMsg'),payload={type:q('#accType').value,username:q('#accUser').value.trim(),name:q('#accName').value.trim(),password:q('#accPwd').value};if(payload.type==='hitter')payload.level=q('#accLevel').value;else payload.member_level=q('#accMember').value;m.textContent='正在创建…';const {data,error}=await sb.functions.invoke('club924-account-admin',{body:payload});m.className=error||data?.error?'err':'ok';m.textContent=error?'创建失败：'+error.message:data?.error?'创建失败：'+data.error:'创建成功：'+data.username};return}if(p==='orders'){const {data=[],error}=await sb.from('club924_orders').select('*,club924_bosses(name)').order('created_at',{ascending:false}).limit(50);if(error){box.innerHTML='<div class="card err">订单读取失败：'+error.message+'</div>';return}box.innerHTML='<div class="card"><div class="row"><h2>订单管理</h2><span class="live">● 实时同步</span></div>'+data.map(orderHtml).join('')+'</div>';return}if(p==='bosses'){const {data=[]}=await sb.from('club924_bosses').select('*').order('created_at',{ascending:false});box.innerHTML='<div class="card"><h2>老板账户</h2>'+data.map(x=>`<div class="item"><b>${x.name}</b><div>用户名：${x.login_name||'-'} · ${x.member_level} · 累计 ¥${x.cumulative_spend||0}</div></div>`).join('')+'</div>';return}if(p==='hitters'){const {data=[]}=await sb.from('club924_hitters').select('*').order('created_at',{ascending:false});box.innerHTML='<div class="card"><h2>打手账户</h2>'+data.map(x=>`<div class="item"><b>${x.name}</b><div>用户名：${x.login_name||'-'} · ${x.level} · 押金 ${x.deposit_paid}/${x.deposit_total} · ${x.status}</div></div>`).join('')+'</div>';return}if(p==='products'){const {data=[]}=await sb.from('club924_products').select('*').order('sort_order');box.innerHTML='<div class="card"><h2>商品管理</h2>'+data.map(x=>`<div class="item"><div class="row"><b>${x.name}</b><span class="badge">${x.is_active?'已上架':'已下架'}</span></div><div class="gold">¥${x.price}</div></div>`).join('')+'</div>';return}if(p==='finance'){const {data=[]}=await sb.from('club924_withdrawals').select('*').order('requested_at',{ascending:false});box.innerHTML='<div class="card"><h2>提现</h2>'+data.map(x=>`<div class="item">${x.coins}金币 = ¥${x.rmb_amount} <span class="badge">${x.status}</span></div>`).join('')+'</div>'}}function orderHtml(o){let btn='';if(o.status==='待客服确认')btn=`<button class="primary" onclick="upd('${o.id}',{status:'已付款待派单',payment_confirmed_at:new Date().toISOString()})">确认已付款</button>`;else if(o.status==='已付款待派单')btn=`<button class="primary" onclick="dispatchOrder('${o.id}','${o.min_hitter_level||'B'}',${o.required_hitter_count||2})">派发抢单</button>`;else if(o.status==='预抢中')btn=`<button onclick="upd('${o.id}',{status:'待抢',grab_stage:'待抢'})">转待抢</button>`;else if(o.status==='已接单')btn=`<button onclick="upd('${o.id}',{status:'进行中',grab_stage:'已锁定'})">开始进行</button>`;return `<div class="item"><div class="row"><div><b>${o.order_name}</b> <span class="badge">${o.status}</span><div class="muted">老板：${o.club924_bosses?.name||'-'}</div></div><div class="gold">¥${o.amount}</div></div><div class="muted">最低 ${o.min_hitter_level||'B'} · ${o.required_hitter_count||2}人 · ${o.grab_stage||'未派发'}</div>${btn}</div>`}async function upd(id,patch){const {error}=await sb.from('club924_orders').update(patch).eq('id',id);if(error)alert('操作失败：'+error.message);else show('orders')}window.upd=upd;window.dispatchOrder=async(id,lv,cnt)=>{const level=(prompt('最低打手等级 B/A/S/SS',lv)||lv).toUpperCase(),count=Number(prompt('需要几名打手',cnt)||cnt);if(!['B','A','S','SS'].includes(level)||count<1||count>8)return alert('等级或人数错误');const now=new Date(),deadline=new Date(now.getTime()+120000);await upd(id,{status:'预抢中',grab_stage:'预抢',min_hitter_level:level,required_hitter_count:count,grab_started_at:now.toISOString(),grab_deadline:deadline.toISOString(),dispatch_date:now.toISOString().slice(0,10)})};window.addEventListener('error',e=>msg('页面脚本错误：'+e.message,'err'));window.addEventListener('load',init);</script></body></html>
