<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>924 管理后台</title><style>:root{--line:#382a24;--gold:#d7b15d;--text:#f5efe6;--muted:#aaa097}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#160909,#070707 32%);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.brand{font-size:26px;font-weight:900;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.card,.item{background:#111;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b0b0b;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;color:var(--gold);font-size:22px}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button,button{background:#171717;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button.active,.primary{background:#7d1f1f}.input{width:100%;background:#090909;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#381515;color:#ffb7b7;font-size:12px}.gold{color:var(--gold);font-size:22px;font-weight:900}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.tabs button{white-space:nowrap}}</style></head><body><div class="wrap"><div class="row"><div><div class="brand">924 黑手党 Club · 管理后台</div><div class="muted">老板、打手、订单、商品、财务统一管理</div></div><button id="logout" class="hidden">退出</button></div><div id="auth" class="card"><h2>后台登录</h2><input id="email" class="input" placeholder="管理员邮箱"><input id="pwd" class="input" type="password" placeholder="密码"><button id="login" class="primary">登录</button><div id="authmsg" class="muted">后台仅允许已授权管理员账号。</div></div><div id="main" class="hidden"><div class="tabs"><button data-p="dash">概览</button><button data-p="orders">订单</button><button data-p="bosses">老板</button><button data-p="hitters">打手</button><button data-p="products">商品</button><button data-p="finance">提现</button></div><div id="page"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://xsfofqinyqinrleqemfj.supabase.co','sb_publishable_UFjJIyYT_pnuB5aUU7Yppw_hP1I0f-k');let member=null;const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];async function refresh(){const {data:{session}}=await sb.auth.getSession();if(!session){q('#auth').classList.remove('hidden');q('#main').classList.add('hidden');return}const {data}=await sb.from('club924_members').select('*').eq('user_id',session.user.id).maybeSingle();if(!data||!data.is_active){q('#authmsg').textContent='该账号没有后台权限。';await sb.auth.signOut();return}member=data;q('#auth').classList.add('hidden');q('#main').classList.remove('hidden');q('#logout').classList.remove('hidden');show('dash')}q('#login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:q('#email').value.trim(),password:q('#pwd').value});q('#authmsg').textContent=error?error.message:'';if(!error)refresh()};q('#logout').onclick=async()=>{await sb.auth.signOut();refresh()};qa('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));async function show(p){const box=q('#page');if(p==='dash'){const [{count:o},{count:b},{count:h},{count:w}]=await Promise.all([sb.from('club924_orders').select('*',{count:'exact',head:true}),sb.from('club924_bosses').select('*',{count:'exact',head:true}),sb.from('club924_hitters').select('*',{count:'exact',head:true}),sb.from('club924_withdrawals').select('*',{count:'exact',head:true})]);box.innerHTML=`<div class="grid"><div class="stat">订单<b>${o||0}</b></div><div class="stat">老板<b>${b||0}</b></div><div class="stat">打手<b>${h||0}</b></div><div class="stat">提现<b>${w||0}</b></div></div>`}if(p==='orders'){const {data=[]}=await sb.from('club924_orders').select('*').order('created_at',{ascending:false}).limit(50);box.innerHTML='<div class="card"><h2>订单管理</h2>'+data.map(o=>`<div class="item"><div class="row"><b>${o.order_name}</b><span class="badge">${o.status}</span></div><div>¥${o.amount} · 最低${o.min_hitter_level} · ${o.required_hitter_count}人</div></div>`).join('')+'</div>'}if(p==='bosses'){const {data=[]}=await sb.from('club924_bosses').select('*');box.innerHTML='<div class="card"><h2>老板账户</h2>'+data.map(x=>`<div class="item"><b>${x.name}</b> · ${x.member_level} · 累计 ¥${x.cumulative_spend||0}</div>`).join('')+'</div>'}if(p==='hitters'){const {data=[]}=await sb.from('club924_hitters').select('*');box.innerHTML='<div class="card"><h2>打手账户</h2>'+data.map(x=>`<div class="item"><b>${x.name}</b> · ${x.level} · 押金 ${x.deposit_paid}/${x.deposit_total} · ${x.status}</div>`).join('')+'</div>'}if(p==='products'){const {data=[]}=await sb.from('club924_products').select('*').order('sort_order');box.innerHTML='<div class="card"><h2>商品</h2>'+data.map(x=>`<div class="item"><b>${x.name}</b> <span class="gold">¥${x.price}</span> · ${x.is_active?'上架':'下架'}</div>`).join('')+'</div>'}if(p==='finance'){const {data=[]}=await sb.from('club924_withdrawals').select('*').order('requested_at',{ascending:false});box.innerHTML='<div class="card"><h2>提现</h2>'+data.map(x=>`<div class="item">${x.coins}金币 = ¥${x.rmb_amount} <span class="badge">${x.status}</span></div>`).join('')+'</div>'}}refresh();</script></body></html>
