<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>924 老板端</title><style>
:root{--bg:#070707;--panel:#111;--line:#382a24;--gold:#d7b15d;--red:#7d1f1f;--text:#f5efe6;--muted:#aaa097}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#160909,#070707 32%);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.brand{font-size:26px;font-weight:900;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.card,.item{background:#111;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0b0b0b;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;color:var(--gold);font-size:22px}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button,button{background:#171717;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button.active,.primary{background:#7d1f1f}.input,select{width:100%;background:#090909;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#381515;color:#ffb7b7;font-size:12px}.gold{color:var(--gold);font-size:22px;font-weight:900}.hidden{display:none}.notice{padding:11px;border:1px solid #6c4c22;background:#25180d;color:#e6c879;border-radius:11px}.chat{height:220px;overflow:auto;background:#090909;border-radius:12px;padding:10px}.msg{padding:9px;background:#211916;border-radius:10px;margin:7px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.tabs{position:sticky;top:0;background:#080808;padding:7px;z-index:4}.tabs button{flex:1;white-space:nowrap}}
</style></head><body><div class="wrap"><div class="row"><div><div class="brand">924 黑手党 Club · 老板端</div><div class="muted">老板专属点单与订单中心</div></div><button id="logout" class="hidden">退出</button></div>
<div id="auth" class="card"><h2>老板登录</h2><input id="email" class="input" placeholder="邮箱"><input id="pwd" class="input" type="password" placeholder="密码"><input id="name" class="input" placeholder="老板称呼（注册时填写）"><div class="row"><button id="login" class="primary">登录</button><button id="signup">注册老板账号</button></div><div id="authmsg" class="muted"></div></div>
<div id="main" class="hidden"><div class="tabs"><button class="active" data-p="shop">点单</button><button data-p="orders">我的订单</button><button data-p="history">历史订单</button><button data-p="member">会员中心</button></div><div id="page"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://xsfofqinyqinrleqemfj.supabase.co','sb_publishable_UFjJIyYT_pnuB5aUU7Yppw_hP1I0f-k',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});
let me=null,boss=null;const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
function showLoggedOut(){q('#auth').classList.remove('hidden');q('#main').classList.add('hidden');q('#logout').classList.add('hidden')}
function showLoggedIn(){q('#auth').classList.add('hidden');q('#main').classList.remove('hidden');q('#logout').classList.remove('hidden')}
async function refresh(){const {data:{session},error:sessionError}=await sb.auth.getSession();if(sessionError){q('#authmsg').textContent='登录状态读取失败，请直接刷新页面重试。';return}if(!session){showLoggedOut();return;}me=session.user;showLoggedIn();const {data,error}=await sb.from('club924_bosses').select('*').eq('user_id',me.id).maybeSingle();if(error){q('#page').innerHTML='<div class="card"><div class="notice">老板资料暂时读取失败，但登录状态已保留。请刷新页面重试。</div></div>';return}if(!data){q('#page').innerHTML='<div class="card"><div class="notice">当前登录账号尚未绑定老板资料。登录状态不会因此丢失。</div></div>';return}boss=data;show('shop');}
q('#login').onclick=async()=>{q('#authmsg').textContent='登录中…';const {error}=await sb.auth.signInWithPassword({email:q('#email').value.trim(),password:q('#pwd').value});q('#authmsg').textContent=error?error.message:'';if(!error)refresh();};
q('#signup').onclick=async()=>{const email=q('#email').value.trim(),password=q('#pwd').value,name=q('#name').value.trim()||'老板';q('#authmsg').textContent='注册中…';const {error}=await sb.auth.signUp({email,password,options:{data:{portal:'boss',name}}});q('#authmsg').textContent=error?error.message:'注册成功；如果系统要求邮箱确认，请先确认后再登录。';if(!error)refresh();};
q('#logout').onclick=async()=>{await sb.auth.signOut();boss=null;me=null;showLoggedOut()};
qa('[data-p]').forEach(b=>b.onclick=()=>{qa('[data-p]').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.p)});
async function show(p){if(!boss)return;const box=q('#page');if(p==='shop'){const {data=[],error}=await sb.from('club924_products').select('*').eq('is_active',true).order('sort_order');if(error){box.innerHTML='<div class="card"><h2>可点订单</h2><div class="notice">商品读取失败：'+error.message+'</div></div>';return}box.innerHTML='<div class="card"><h2>可点订单</h2>'+(data.length?data.map(x=>`<div class="item"><div class="row"><b>${x.name}</b><span class="gold">¥${x.price}</span></div><div class="muted">${x.description||''}</div><button class="primary" onclick="placeOrder(\'${x.id}\',\'${String(x.name).replaceAll("'","\\'")}\',${x.price})">立即下单</button></div>`).join(''):'<div class="notice">后台暂未上架商品。</div>')+'</div>';}if(p==='orders'||p==='history'){const finished=p==='history';let qr=sb.from('club924_orders').select('*').eq('boss_id',boss.id).order('created_at',{ascending:false});if(finished)qr=qr.in('status',['已完成','已结单','已退款','已取消']);else qr=qr.not('status','in','("已完成","已结单","已退款","已取消")');const {data=[]}=await qr;box.innerHTML='<div class="card"><h2>'+(finished?'历史订单':'我的订单')+'</h2>'+(data.length?data.map(o=>`<div class="item"><div class="row"><b>${o.order_name}</b><span class="badge">${o.status}</span></div><div class="gold">¥${o.amount}</div><div class="muted">${new Date(o.created_at).toLocaleString()}</div></div>`).join(''):'<div class="muted">暂无订单</div>')+'</div>';}if(p==='member'){box.innerHTML=`<div class="card"><h2>会员中心</h2><div class="grid"><div class="stat">当前等级<b>${boss.member_level}</b></div><div class="stat">累计消费<b>¥${Number(boss.cumulative_spend||0).toFixed(2)}</b></div><div class="stat">老板名称<b>${boss.name}</b></div></div></div>`;}}
window.placeOrder=async(id,name,price)=>{if(!confirm('确认下单：'+name+'？'))return;const {error}=await sb.from('club924_orders').insert({boss_id:boss.id,product_id:id,order_name:name,amount:price,status:'待客服确认'});alert(error?error.message:'下单成功，等待客服确认付款。');if(!error)show('orders');};
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){boss=null;me=null;showLoggedOut();return}if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'||event==='INITIAL_SESSION')setTimeout(refresh,0)});refresh();
</script></body></html>
