<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>924 老板端</title><style>:root{--line:#382a24;--gold:#d7b15d;--text:#f5efe6;--muted:#aaa097}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#160909,#070707 32%);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.brand{font-size:26px;font-weight:900;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.card,.item{background:#111;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0b0b0b;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;color:var(--gold);font-size:22px}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button,button{background:#171717;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button.active,.primary{background:#7d1f1f}.input{width:100%;background:#090909;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#381515;color:#ffb7b7;font-size:12px}.gold{color:var(--gold);font-size:22px;font-weight:900}.hidden{display:none}.notice{padding:11px;border:1px solid #6c4c22;background:#25180d;color:#e6c879;border-radius:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}.tabs button{flex:1;white-space:nowrap}}</style></head><body><div class="wrap"><div class="row"><div><div class="brand">924 黑手党 Club · 老板端</div><div class="muted">老板专属点单与订单中心</div></div><button id="logout" class="hidden" onclick="logoutNow()">退出</button></div><div id="auth" class="card"><h2>老板登录</h2><input id="username" class="input" placeholder="用户名" autocomplete="username"><input id="pwd" class="input" type="password" placeholder="密码" autocomplete="current-password"><button id="login" class="primary" type="button" onclick="loginNow()">登录</button><div id="authmsg" class="muted">老板账号由后台创建，不开放自行注册。</div></div><div id="main" class="hidden"><div class="tabs"><button class="active" data-p="shop">点单</button><button data-p="orders">我的订单</button><button data-p="history">历史订单</button><button data-p="member">会员中心</button></div><div id="page"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script>const URL='https://xsfofqinyqinrleqemfj.supabase.co',KEY='sb_publishable_UFjJIyYT_pnuB5aUU7Yppw_hP1I0f-k';let sb=null,boss=null,me=null;const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];function logged(v){q('#auth').classList.toggle('hidden',v);q('#main').classList.toggle('hidden',!v);q('#logout').classList.toggle('hidden',!v)}function init(){try{if(!window.supabase)throw new Error('登录组件加载失败，请刷新页面');sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage,storageKey:'club924_boss_session'}});qa('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));refresh()}catch(e){q('#authmsg').textContent=e.message}}async function loginNow(){const msg=q('#authmsg'),u=q('#username').value.trim(),p=q('#pwd').value;if(!u||!p){msg.textContent='请输入用户名和密码';return}msg.textContent='登录中…';q('#login').disabled=true;try{const {data,error}=await sb.functions.invoke('club924-portal-login',{body:{portal:'boss',username:u,password:p}});if(error)throw new Error(error.message||'登录接口失败');if(!data||data.error)throw new Error(data?.error||'登录失败');const r=await sb.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(r.error)throw r.error;msg.textContent='登录成功';await refresh()}catch(e){msg.textContent='登录失败：'+(e.message||e)}finally{q('#login').disabled=false}}async function refresh(){if(!sb)return;const {data:{session},error}=await sb.auth.getSession();if(error){q('#authmsg').textContent='登录状态读取失败：'+error.message;logged(false);return}if(!session){logged(false);return}me=session.user;const r=await sb.from('club924_bosses').select('*').eq('user_id',me.id).maybeSingle();if(r.error||!r.data){logged(false);q('#authmsg').textContent=r.error?'老板资料读取失败：'+r.error.message:'该账号不是老板账号';return}boss=r.data;logged(true);show('shop')}async function logoutNow(){if(sb)await sb.auth.signOut();boss=null;me=null;logged(false)}async function show(p){if(!boss)return;qa('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));const box=q('#page');if(p==='shop'){const {data=[],error}=await sb.from('club924_products').select('*').eq('is_active',true).order('sort_order');if(error){box.innerHTML='<div class="card notice">商品读取失败：'+error.message+'</div>';return}box.innerHTML='<div class="card"><h2>可点订单</h2>'+(data.length?data.map(x=>'<div class="item"><div class="row"><b>'+x.name+'</b><span class="gold">¥'+x.price+'</span></div><div class="muted">'+(x.description||'')+'</div><button class="primary" onclick="placeOrder(\''+x.id+'\')">立即下单</button></div>').join(''):'<div class="muted">后台暂未上架商品</div>')+'</div>'}else if(p==='orders'||p==='history'){const done=p==='history';let qr=sb.from('club924_orders').select('*').eq('boss_id',boss.id).order('created_at',{ascending:false});qr=done?qr.in('status',['已完成','已结单','已退款','已取消']):qr.not('status','in','("已完成","已结单","已退款","已取消")');const {data=[],error}=await qr;if(error){box.innerHTML='<div class="card notice">订单读取失败：'+error.message+'</div>';return}box.innerHTML='<div class="card"><h2>'+(done?'历史订单':'我的订单')+'</h2>'+(data.length?data.map(o=>'<div class="item"><div class="row"><b>'+o.order_name+'</b><span class="badge">'+o.status+'</span></div><div class="gold">¥'+o.amount+'</div><div class="muted">'+new Date(o.created_at).toLocaleString()+'</div></div>').join(''):'<div class="muted">暂无订单</div>')+'</div>'}else if(p==='member'){box.innerHTML='<div class="card"><h2>会员中心</h2><div class="grid"><div class="stat">当前等级<b>'+boss.member_level+'</b></div><div class="stat">累计消费<b>¥'+Number(boss.cumulative_spend||0).toFixed(2)+'</b></div><div class="stat">用户名<b>'+(boss.login_name||boss.name)+'</b></div></div></div>'}}async function placeOrder(id){const {data:p,error}=await sb.from('club924_products').select('*').eq('id',id).single();if(error)return alert(error.message);if(!confirm('确认下单：'+p.name+'？'))return;const r=await sb.from('club924_orders').insert({boss_id:boss.id,product_id:p.id,order_name:p.name,amount:p.price,status:'待客服确认'});alert(r.error?r.error.message:'下单成功，等待客服确认付款。');if(!r.error)show('orders')}window.loginNow=loginNow;window.logoutNow=logoutNow;window.placeOrder=placeOrder;window.addEventListener('load',init);</script></body></html>
